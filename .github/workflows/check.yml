name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with: {python-version: '3.13'}
    - run: pip install uv==0.11.19
    - run: uv sync --frozen
    - run: uv run ruff check hooapprove tests examples
    - run: uv run ruff format --check hooapprove tests examples
    - run: uv run pytest -q
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with: {node-version: '24', cache: npm, cache-dependency-path: native/package-lock.json}
    - run: npm ci
    - run: npm run check
    - run: npm run lint
    - run: npx expo export --platform ios --platform android
