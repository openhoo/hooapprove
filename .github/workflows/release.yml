name: Publish preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact tested preview tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.tag }}
        fetch-depth: 0
        persist-credentials: false
    - id: verify
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]
        sha=$(git rev-parse HEAD)
        test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$sha"
        test "$(git rev-parse origin/main)" = "$sha"
        runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --commit "$sha" --event push --status success --json databaseId --jq length)
        test "$runs" -gt 0
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: {ref: '${{ needs.verify.outputs.sha }}', persist-credentials: false}
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          ghcr.io/${{ github.repository }}:sha-${{ needs.verify.outputs.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
          org.opencontainers.image.version=${{ inputs.tag }}
          org.opencontainers.image.licenses=Apache-2.0
        provenance: mode=max
        sbom: true
        cache-from: type=gha,scope=hooapprove-image
        cache-to: type=gha,mode=max,scope=hooapprove-image
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run: {working-directory: native}
    env:
      EXPO_PUBLIC_HOOAPPROVE_URL: http://127.0.0.1:8097
      NODE_ENV: production
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: {ref: '${{ needs.verify.outputs.sha }}', persist-credentials: false}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with: {node-version: '24', cache: npm, cache-dependency-path: native/package-lock.json}
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with: {distribution: temurin, java-version: '21'}
    - run: npm ci --include=dev --no-audit --no-fund
    - run: npx expo prebuild --platform android --no-install
    - run: cd android && ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
    - name: Collect demo APK
      run: |
        mkdir -p ../release-assets
        cp android/app/build/outputs/apk/release/app-release.apk ../release-assets/hooapprove-demo-android-arm64.apk
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ../release-assets/hooapprove-demo-android-arm64.apk
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: android-demo
        path: release-assets/*.apk
        if-no-files-found: error
        retention-days: 3
  publish:
    needs: [verify, image, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: {ref: '${{ needs.verify.outputs.sha }}', persist-credentials: false}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with: {name: android-demo, path: release-assets}
    - name: Package chart and release metadata
      env:
        IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        command -v helm
        cp LICENSE deploy/LICENSE
        helm lint deploy --set "image=ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST"
        helm package deploy --destination release-assets
        printf '%s\n' "ghcr.io/$GITHUB_REPOSITORY@$IMAGE_DIGEST" > release-assets/IMAGE.txt
        printf '%s\n' "$RELEASE_SHA" > release-assets/SOURCE.txt
        cat > release-assets/NOTES.md <<'NOTES'
        # HooApprove preview

        Native approval app, generic authorization API, and Helm chart.

        **Android APK:** demo only, ARM64, debug signed, bundled JavaScript, local API at
        `http://127.0.0.1:8097`. Start the loopback demo service and use
        `adb reverse tcp:8097 tcp:8097` on the connected Android device. This APK
        does not send REWE orders and is not a Play Store release.

        **Service image:** amd64/arm64, source revision and digest in the attached metadata.
        Production requires your HTTPS origin, OIDC client, protected executor credentials,
        durable storage, and backups. The planned OpenHoo URL is not a deployment claim.

        **iOS:** source included; no signed IPA or TestFlight publication.

        Native dependency audit, actual push delivery, physical-device biometrics and real
        REWE checkout remain release gates. See docs/verification.md and docs/architecture.md.
        NOTES
        (cd release-assets && sha256sum *.apk *.tgz IMAGE.txt SOURCE.txt > SHA256SUMS)
    - name: Publish prerelease
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/*.tgz release-assets/IMAGE.txt release-assets/SOURCE.txt release-assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file release-assets/NOTES.md --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/*.tgz release-assets/IMAGE.txt release-assets/SOURCE.txt release-assets/SHA256SUMS --verify-tag --prerelease --title "HooApprove $RELEASE_TAG" --notes-file release-assets/NOTES.md --repo "$GITHUB_REPOSITORY"
        fi
